# Render Blueprint - 백엔드(backend/)를 Render의 Web Service로 배포합니다.
# 사용법: Render 대시보드 → New + → Blueprint → 이 저장소 선택 → 이 파일을 자동으로 읽어 설정합니다.
# sync: false 로 표시된 값들은 Blueprint 생성 과정에서 직접 입력하라는 뜻이며,
# 이 파일(=git 저장소)에는 절대 저장되지 않습니다.
services:
  - name: gabin-portfolio-backend
    type: web
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Vercel에 배포된 프론트엔드 주소 (CORS 허용 + 쿠키 cross-site 설정에 사용됩니다)
      - key: FRONTEND_ORIGIN
        value: https://new-repository-one-rose.vercel.app
      - key: ADMIN_SESSION_HOURS
        value: "8"
      # ---- 아래 값들은 Blueprint 생성 화면에서 직접 입력하세요 ----
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_JWT_SECRET
        sync: false
      # Upstash Redis 등 KV 스토어를 쓸 경우에만 입력 (비워두면 로컬처럼 파일 저장을
      # 시도하지만, Render Free 인스턴스는 재배포/재시작 시 디스크가 초기화되므로
      # 실제 운영에서는 아래 값을 꼭 채우는 것을 권장합니다)
      - key: KV_REST_API_URL
        sync: false
      - key: KV_REST_API_TOKEN
        sync: false
