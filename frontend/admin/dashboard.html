<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프로젝트 관리 | 이가빈 Portfolio</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">
  <header class="admin-header">
    <h1>프로젝트 관리</h1>
    <div class="admin-header-actions">
      <a href="dashboard.html" class="btn btn-primary admin-tab" aria-current="page">프로젝트 관리</a>
      <a href="reservations.html" class="btn btn-outline admin-tab">예약하기 관리</a>
      <button id="logoutBtn" class="btn btn-outline" type="button">로그아웃</button>
    </div>
  </header>

  <main class="admin-main">
    <div class="admin-toolbar">
      <a href="editor.html" class="btn btn-primary">+ 새 프로젝트</a>
    </div>
    <div class="dup-warning" id="duplicateWarning" hidden></div>
    <p class="loading-text" id="listStatus">불러오는 중...</p>
    <div class="admin-project-list" id="projectList"></div>

    <section class="admin-achieve">
      <h2>활동 &amp; 자격증 <span class="admin-achieve-sub">메인 페이지에 표시 중</span></h2>
      <p class="loading-text" id="achieveStatus">불러오는 중...</p>
      <div class="admin-project-list" id="achieveList"></div>
      <p class="admin-hint">이 항목은 서버 데이터 파일(achievements.json)로 관리되어, 현재는 관리자 화면에서 목록 확인만 가능합니다.</p>
    </section>
  </main>

  <script src="../js/config.js"></script>
  <script src="js/admin-api.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
