<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 로그인 | 이가빈 Portfolio</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">
  <div class="admin-login-wrap">
    <form class="admin-login-card" id="loginForm" novalidate autocomplete="off">
      <h1>관리자 로그인</h1>
      <p class="admin-login-desc">비밀번호를 입력하면 프로젝트를 관리할 수 있습니다.</p>

      <label for="password">비밀번호</label>
      <input
        type="password"
        id="password"
        name="password"
        autocomplete="off"
        placeholder="비밀번호 입력"
        required
      >

      <p class="admin-error" id="loginError" hidden></p>

      <button type="submit" class="btn btn-primary admin-submit" id="loginSubmit">로그인</button>
    </form>
  </div>

  <script src="../js/config.js"></script>
  <script src="js/admin-api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
